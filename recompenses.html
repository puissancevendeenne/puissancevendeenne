    const pageMusic = document.getElementById("pageMusic");

function startPageMusic(){
  if(!pageMusic) return;

  pageMusic.loop = true;
  pageMusic.volume = 0.35;

  const playPromise = pageMusic.play();
  if(playPromise !== undefined){
    playPromise.catch(err => {
      console.warn("Lecture musique page bloquée :", err);
    });
  }
}

function enablePageMusic(){
  const shouldStart = sessionStorage.getItem("pvj_next_music_target") === "page";

  if (!shouldStart) return;

  const startOnPageClick = () => {
    startPageMusic();
    sessionStorage.removeItem("pvj_next_music_target");
    document.removeEventListener("click", startOnPageClick);
    document.removeEventListener("keydown", startOnPageClick);
  };

  document.addEventListener("click", startOnPageClick, { once: true });
  document.addEventListener("keydown", startOnPageClick, { once: true });
}

    function ensureDefaults() {
      if (localStorage.getItem("pvj_vies") === null) localStorage.setItem("pvj_vies", "5");
      if (localStorage.getItem("pvj_pieces") === null) localStorage.setItem("pvj_pieces", "0");
      if (localStorage.getItem("pvj_sel") === null) localStorage.setItem("pvj_sel", "0");
      if (localStorage.getItem("pvj_unlimited_lives_until") === null) localStorage.setItem("pvj_unlimited_lives_until", "");
      if (localStorage.getItem("pvj_pseudo") === null) localStorage.setItem("pvj_pseudo", "Un Chouan");
      if (localStorage.getItem("pvj_lys") === null) localStorage.setItem("pvj_lys", "0");
      if (localStorage.getItem("pvj_grade") === null) localStorage.setItem("pvj_grade", "Pacifiste");
      if (localStorage.getItem("pvj_avatar") === null) localStorage.setItem("pvj_avatar", "images/unchouanphotoprofildefautpvjeu.png");
      if (localStorage.getItem("pvj_crown") === null) localStorage.setItem("pvj_crown", "");
      if (localStorage.getItem("pvj_owned_decorations") === null) localStorage.setItem("pvj_owned_decorations", JSON.stringify([]));
      if (localStorage.getItem("pvj_selected_decoration") === null) localStorage.setItem("pvj_selected_decoration", "");
      if (localStorage.getItem("pvj_owned_crowns") === null) localStorage.setItem("pvj_owned_crowns", JSON.stringify([]));

      if (localStorage.getItem("pvj_owned_avatars") === null) {
        localStorage.setItem("pvj_owned_avatars", JSON.stringify([
          "unchouan",
          "unechouanne"
        ]));
      }
    }

    function isUnlimitedLivesActive() {
      const until = localStorage.getItem("pvj_unlimited_lives_until");
      if (!until) return false;
      return Date.now() < new Date(until).getTime();
    }

    function refreshTopbar() {
      const vies = parseInt(localStorage.getItem("pvj_vies"), 10) || 5;
      const pieces = parseInt(localStorage.getItem("pvj_pieces"), 10) || 0;
      const sel = parseInt(localStorage.getItem("pvj_sel"), 10) || 0;

      document.getElementById("vies-count").textContent = isUnlimitedLivesActive()
        ? `${vies}/${MAX_BASE_LIVES}∞`
        : `${vies}/${MAX_BASE_LIVES}`;

      document.getElementById("pieces-count").textContent = pieces;
      document.getElementById("sel-count").textContent = sel;
    }

    function getOwnedAvatars() {
      try {
        return JSON.parse(localStorage.getItem("pvj_owned_avatars")) || [];
      } catch {
        return [];
      }
    }

    function setOwnedAvatars(arr) {
      localStorage.setItem("pvj_owned_avatars", JSON.stringify(arr));
    }

    function getOwnedDecorations() {
      try {
        return JSON.parse(localStorage.getItem("pvj_owned_decorations")) || [];
      } catch {
        return [];
      }
    }

    function setOwnedDecorations(arr) {
      localStorage.setItem("pvj_owned_decorations", JSON.stringify(arr));
    }

    function getOwnedCrowns() {
      try {
        return JSON.parse(localStorage.getItem("pvj_owned_crowns")) || [];
      } catch {
        return [];
      }
    }

    function setOwnedCrowns(arr) {
      localStorage.setItem("pvj_owned_crowns", JSON.stringify(arr));
    }

    function getCoins() {
      return parseInt(localStorage.getItem("pvj_pieces"), 10) || 0;
    }

    function setCoins(value) {
      localStorage.setItem("pvj_pieces", String(value));
    }

    function getSalt() {
      return parseInt(localStorage.getItem("pvj_sel"), 10) || 0;
    }

    function setSalt(value) {
      localStorage.setItem("pvj_sel", String(value));
    }

    function canAfford(item) {
      return item.currency === "coins"
        ? getCoins() >= item.price
        : getSalt() >= item.price;
    }

    function getPriceLabel(item) {
      if (item.price === 0) return "Gratuit";
      return item.currency === "coins"
        ? `${item.price} pièce${item.price > 1 ? "s" : ""}`
        : `${item.price} sel${item.price > 1 ? "s" : ""}`;
    }

    function isSelected(item) {
      return localStorage.getItem("pvj_avatar") === item.image;
    }

    function buyAvatar(itemId) {
      const item = avatarItems.find(a => a.id === itemId);
      if (!item) return;

      const owned = getOwnedAvatars();
      if (owned.includes(item.id)) return;
      if (!canAfford(item)) return;

      if (item.currency === "coins") {
        setCoins(getCoins() - item.price);
      } else {
        setSalt(getSalt() - item.price);
      }

      owned.push(item.id);
      setOwnedAvatars(owned);
      renderAvatars();
      refreshTopbar();
    }

    function selectAvatar(itemId) {
      const item = avatarItems.find(a => a.id === itemId);
      if (!item) return;

      const owned = getOwnedAvatars();
      if (!owned.includes(item.id)) return;

      localStorage.setItem("pvj_avatar", item.image);
      renderAvatars();
    }

    function renderAvatars() {
      const grid = document.getElementById("avatars-grid");
      const owned = getOwnedAvatars();
      grid.innerHTML = "";

      avatarItems.forEach(item => {
        const ownedItem = owned.includes(item.id);
        const selected = isSelected(item);
        const affordable = canAfford(item);

        const card = document.createElement("article");
        card.className = "avatar-card";

        if (!ownedItem) card.classList.add("locked-soft");
        if (!ownedItem && affordable) card.classList.add("affordable-soft");
        if (selected) card.classList.add("selected");


        const buttonHtml = ownedItem
          ? `<button class="avatar-btn select-btn ${selected ? "is-selected" : ""}" data-select="${item.id}">
               ${selected ? "Sélectionné" : "Sélectionner"}
             </button>`
          : `<button class="avatar-btn buy-btn" data-buy="${item.id}" ${!affordable ? "disabled" : ""}>
               Acheter
             </button>`;

        card.innerHTML = `
          <div class="avatar-frame">
            <img src="${item.image}" alt="${item.name}" class="avatar-image ${item.id === "embleme" ? "emblem-fit" : ""}" />
          </div>
          <div class="avatar-name">${item.name}</div>
          <div class="avatar-price">${getPriceLabel(item)}</div>
          ${buttonHtml}
        `;

        grid.appendChild(card);
      });

      grid.querySelectorAll("[data-buy]").forEach(btn => {
        btn.addEventListener("click", () => buyAvatar(btn.dataset.buy));
      });

      grid.querySelectorAll("[data-select]").forEach(btn => {
        btn.addEventListener("click", () => selectAvatar(btn.dataset.select));
      });
    }

    function isDecorationSelected(item) {
      return localStorage.getItem("pvj_selected_decoration") === item.image;
    }

    function canAffordDecoration(item) {
      if (item.unlockType !== "shop") return false;
      return item.currency === "coins"
        ? getCoins() >= item.price
        : getSalt() >= item.price;
    }

    function getDecorationPriceLabel(item) {
      if (item.unlockType === "progress") {
        return item.description || "À débloquer";
      }

      if (item.price === 0) return "Gratuit";

      return item.currency === "coins"
        ? `${item.price} pièce${item.price > 1 ? "s" : ""}`
        : `${item.price} sel${item.price > 1 ? "s" : ""}`;
    }

    function buyDecoration(itemId) {
      const item = decorationItems.find(d => d.id === itemId);
      if (!item || item.unlockType !== "shop") return;

      const owned = getOwnedDecorations();
      if (owned.includes(item.id)) return;
      if (!canAffordDecoration(item)) return;

      if (item.currency === "coins") {
        setCoins(getCoins() - item.price);
      } else {
        setSalt(getSalt() - item.price);
      }

      owned.push(item.id);
      setOwnedDecorations(owned);
      renderDecorations();
      refreshTopbar();
    }

    function selectDecoration(itemId) {
      const item = decorationItems.find(d => d.id === itemId);
      if (!item) return;

      const owned = getOwnedDecorations();
      if (!owned.includes(item.id)) return;

      localStorage.setItem("pvj_selected_decoration", item.image);
      renderDecorations();
    }

    function renderDecorations() {
      const grid = document.getElementById("decorations-grid");
      const owned = getOwnedDecorations();
      grid.innerHTML = "";

      decorationItems.forEach(item => {
        const ownedItem = owned.includes(item.id);
        const selected = isDecorationSelected(item);
        const affordable = canAffordDecoration(item);
        const locked = !ownedItem;

        const card = document.createElement("article");
        card.className = "deco-card";

        if (locked) card.classList.add("locked-soft");
        if (!ownedItem && affordable)
          card.classList.add("affordable-soft");
        if (selected) card.classList.add("selected");

        let buttonHtml = "";

        if (ownedItem) {
          buttonHtml = `
            <button class="avatar-btn select-btn ${selected ? "is-selected" : ""}" data-select-decoration="${item.id}">
              ${selected ? "Sélectionnée" : "Sélectionner"}
            </button>
          `;
        } else if (item.unlockType === "shop") {
          buttonHtml = `
            <button class="avatar-btn buy-btn" data-buy-decoration="${item.id}" ${!affordable ? "disabled" : ""}>
              Acheter
            </button>
          `;
        } else {
          buttonHtml = `
            <button class="avatar-btn progress-btn" disabled>
              À débloquer
            </button>
          `;
        }

        card.innerHTML = `
          <div class="deco-frame">
            <img src="${item.image}" alt="${item.name}" class="deco-image" />
          </div>
          <div class="avatar-name">${item.name}</div>
          <div class="avatar-price">${getDecorationPriceLabel(item)}</div>
          ${buttonHtml}
        `;

        grid.appendChild(card);
      });

      grid.querySelectorAll("[data-buy-decoration]").forEach(btn => {
        btn.addEventListener("click", () => buyDecoration(btn.dataset.buyDecoration));
      });

      grid.querySelectorAll("[data-select-decoration]").forEach(btn => {
        btn.addEventListener("click", () => selectDecoration(btn.dataset.selectDecoration));
      });
    }

    function isCrownSelected(item) {
      return localStorage.getItem("pvj_crown") === item.image;
    }

    function equipCrown(crownId) {
      const item = crownItems.find(c => c.id === crownId);
      if (!item) return;

      const owned = getOwnedCrowns();
      if (!owned.includes(item.id)) return;

      localStorage.setItem("pvj_crown", item.image);
      renderCrowns();
    }

    function renderCrowns() {
      const grid = document.getElementById("crowns-grid");
      const owned = getOwnedCrowns();
      grid.innerHTML = "";

      crownItems.forEach(item => {
        const ownedItem = owned.includes(item.id);
        const selected = isCrownSelected(item);

        const card = document.createElement("article");
        card.className = "crown-card";

        if (!ownedItem) card.classList.add("locked");
        if (selected) card.classList.add("selected");

        const shownImage = ownedItem ? item.image : item.lockedImage;
        const buttonHtml = ownedItem
          ? `<button class="avatar-btn select-btn ${selected ? "is-selected" : ""}" data-select-crown="${item.id}">
               ${selected ? "Équipée" : "Équiper"}
             </button>`
          : `<button class="avatar-btn progress-btn" disabled>
               À débloquer en Diplôme
             </button>`;

        card.innerHTML = `
          <div class="crown-frame">
            <img src="${shownImage}" alt="${item.name}" class="crown-image" />
          </div>
          <div class="crown-title crown-title-light">${item.name}</div>
          <div class="avatar-price">${ownedItem ? "Débloquée" : "Non débloquée"}</div>
          ${buttonHtml}
        `;

        grid.appendChild(card);
      });

      grid.querySelectorAll("[data-select-crown]").forEach(btn => {
        btn.addEventListener("click", () => equipCrown(btn.dataset.selectCrown));
      });
    }

    ensureDefaults();
    refreshTopbar();
    renderAvatars();
    renderDecorations();
    renderCrowns();

    window.addEventListener("pageshow", () => {
      refreshTopbar();
      renderAvatars();
      renderDecorations();
      renderCrowns();
    });

    window.addEventListener("focus", () => {
      refreshTopbar();
      renderAvatars();
      renderDecorations();
      renderCrowns();
    });

enablePageMusic();

document.querySelector('a[href="menujeu.html"]')?.addEventListener("click", () => {
  sessionStorage.setItem("pvj_audio_unlocked_tab", "true");
  sessionStorage.setItem("pvj_next_music_target", "menu");
});
